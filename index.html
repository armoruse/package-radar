<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的期待包裹 | 3 種風格提案</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body class="min-h-screen transition-colors duration-300 antialiased" id="app-body">

  <!-- Top Style Selector Bar (Sticky) -->
  <nav class="sticky top-0 z-50 backdrop-blur-md bg-black/85 border-b border-white/10 text-white px-4 py-3 shadow-lg">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-xs font-bold uppercase tracking-wider text-slate-300">風格體驗切換器：</span>
      </div>

      <!-- 3 Style Buttons -->
      <div class="flex items-center bg-slate-900/90 p-1 rounded-xl border border-slate-700/80 text-xs w-full sm:w-auto overflow-x-auto">
        <button onclick="switchTheme(1)" id="btn-theme-1" class="theme-btn px-3 py-1.5 rounded-lg font-medium transition whitespace-nowrap active-theme">
          📱 方案 1：iOS 靈動島
        </button>
        <button onclick="switchTheme(2)" id="btn-theme-2" class="theme-btn px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition whitespace-nowrap">
          ⏱️ 方案 2：時光旅程線
        </button>
        <button onclick="switchTheme(3)" id="btn-theme-3" class="theme-btn px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition whitespace-nowrap">
          📖 方案 3：選物日誌
        </button>
      </div>
    </div>
  </nav>

  <!-- Dynamic Content Container -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-8" id="view-container">
    <!-- Rendered dynamically by app.js based on selected theme -->
  </main>

  <script src="app.js?v=4"></script>
</body>
</html>
