<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>包裹抵達時間表 | Package Timeline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body class="min-h-screen py-10 px-4 sm:px-6 lg:px-8 antialiased selection:bg-zinc-800 selection:text-white">

  <!-- Main Container -->
  <main class="max-w-2xl mx-auto space-y-8">

    <!-- Clean Header -->
    <header class="pb-5 border-b border-zinc-200/80 flex items-start justify-between">
      <div>
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="text-xs uppercase tracking-widest text-zinc-500 font-mono font-semibold">DELIVERY SCHEDULE</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-zinc-900 tracking-tight mt-1.5">包裹抵達時間表</h1>
        <p id="header-subtitle" class="text-xs sm:text-sm text-zinc-500 mt-1">獨立包裹按到貨日期依序呈現 · 5 件在途中 · 3 件已配達</p>
      </div>

      <div class="flex items-center gap-2 pt-1">
        <button onclick="refreshData()" class="p-2 sm:px-3 sm:py-1.5 text-xs text-zinc-600 hover:text-zinc-900 bg-white border border-zinc-200 hover:border-zinc-300 rounded-xl shadow-xs transition flex items-center gap-1.5" title="重新整理">
          <i class="fa-solid fa-arrows-rotate text-zinc-400" id="refresh-icon"></i>
          <span class="hidden sm:inline">重新整理</span>
        </button>
      </div>
    </header>

    <!-- Grouped Date Blocks Container -->
    <div id="schedule-container" class="space-y-8">
      <!-- Injected by JavaScript -->
    </div>

    <!-- Footer Note -->
    <footer class="pt-8 pb-6 text-center border-t border-zinc-200/60 text-xs text-zinc-400">
      <p>Package Timeline · 24H 雲端即時自動同步 (支援手動快速切換簽收狀態)</p>
    </footer>

  </main>

  <script src="app.js?v=8"></script>
</body>
</html>
